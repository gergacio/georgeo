<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OUK</title> 

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://kit.fontawesome.com/025368e06c.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      @import url("https://fonts.cdnfonts.com/css/pp-neue-montreal");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "PP Neue Montreal", sans-serif;
        text-transform: uppercase;
        line-height: 0.85;
      }
      .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        font:bolder;
        text-align: center;
        font-size: clamp(1rem, 1vw, 1rem);
        padding: 1rem;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .loader {
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        overflow: hidden;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        z-index: 2;
      }

      .card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 250px;
        height: 300px;
        clip-path: polygon(20% 20%, 80% 20%, 80% 80%, 20% 80%);
      }

      .brand {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        visibility: hidden;
      }

      .title {
        font-size: clamp(2rem, 10vw, 15rem);
      }

      .count {
        position: absolute;
        top: -1.5rem;
        left: calc(100% + 1.5rem);
        overflow: hidden;
        font-size: clamp(1rem, 1.5vw, 2rem);
      }

      .hero {
        position: relative;
        height: 100svh;
        background: whitesmoke;
        color: #14161c;
        overflow: hidden;
      }

      .heading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(2.5rem, 15vw, 25rem);
        white-space: nowrap;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="loader">


      <div class="brand">
        <h1 class="title">OUK</h1>
        <div class="count"><p></p></div>
      </div>
    </div>

    <section class="hero">
        <div style="padding: 1rem;">
       
            <hr style="margin-bottom: 1rem; width: 100%">
           
            <div>
              
                <p>Gospodinov G. G.</p>
              
                </div>
                
     

          
            <p>
                                                  <a style="color: black; text-decoration: none"  href="https://github.com/gergacio"> GitHub</a> </p>
     <p>X (Twitter)</p> 

            <p>
                                                  <a style="color: black; text-decoration: none"  href="https://www.linkedin.com/in/gggbg/"> LinkedIn</a> </p>

       

            <p>Instagram</p>
            <p>Facebook · Meta</p>
             <p class="label"><a style="color: black" href="https://ouk.vercel.app/">OUK UI <i class="fa-solid fa-square-arrow-up-right"></i></a></p>

                   
            
        </div>
      <h1 class="heading">OUK UI</h1>
   
    
    </section>
   
    

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script>

      const title = new SplitText(".title", { type: "chars", mask: "chars" });
      const heading = new SplitText(".heading", { type: "chars", mask: "chars" });
      const counter = document.querySelector(".count p");

   

      gsap.set(".count p", { yPercent: 100 });

      const tl = gsap.timeline({ delay: 0.5 });

  

      tl.set(".brand", { visibility: "visible" }, 0.35);

      tl.to(title.chars, {
        yPercent: 0,
        rotation: 0,
        duration: 1,
        ease: "power3.out",
        stagger: 0.04,
      }, 0.35);

      tl.to(".count p", { yPercent: 0, duration: 1, ease: "power3.out" }, "<");

      tl.to({ value: 0 }, {
        value: 100,
        duration: 2,
        ease: "power2.inOut",
        onUpdate() {
          counter.textContent = String(Math.round(this.targets()[0].value)).padStart(3, "0");
        },
      }, "<0.5");

      tl.to(title.chars, {
        yPercent: -100,
        rotation: -10,
        duration: 0.75,
        ease: "power3.in",
        stagger: 0.04,
      }, 3.25);

      tl.to(".count p", { yPercent: -100, duration: 0.75, ease: "power3.in" }, 3.25);

      tl.to(".card", {
        scale: 0,
        clipPath: "polygon(20% 20%, 80% 20%, 80% 80%, 20% 80%)",
        duration: 1,
        ease: "power3.inOut",
        stagger: -0.075,
      }, 3.5);

      tl.to(".loader", {
        clipPath: "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)",
        duration: 1,
        ease: "power3.inOut",
      }, 4.35);

      tl.set(".heading", { visibility: "visible" }, 4.65);

      tl.to(heading.chars, {
        yPercent: 0,
        rotation: 0,
        duration: 1,
        ease: "power3.out",
        stagger: 0.04,
      }, 4.65);
    </script>
    <div>
       
 <p class="footer">© 2026</p>
    </div>
     
  
  </body>
</html>
